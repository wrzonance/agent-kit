name: CI

# The suite is the only thing standing between this tree and the classes of
# defect an external review already found in it. Running it locally is a habit;
# running it here is a fact.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: gates and suites
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
          # This job checks out and executes PR-author-controlled code on
          # pull_request; persisting the token would leave it readable from
          # .git/config to anything that tree runs.
          persist-credentials: false
          # bench/tier0.sh reproduces the token-benchmark epic's numbers by
          # measuring specific historical commits (06d18cf, 53e7e8c); the
          # default shallow clone (fetch-depth: 1) does not contain them, so
          # the suite needs full history to run that reproduction.
          fetch-depth: 0

      - name: Install pinned ShellCheck
        # Reference release: ShellCheck v0.11.0
        # SHA-256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          set -euo pipefail
          version=0.11.0
          archive='shellcheck-v0.11.0.linux.x86_64.tar.xz'
          url="https://github.com/koalaman/shellcheck/releases/download/v${version}/${archive}"
          expected_sha256=8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
          download_dir=$(mktemp -d)
          install_dir="${RUNNER_TEMP}/shellcheck-v${version}/bin"
          trap 'rm -rf -- "$download_dir"' EXIT
          curl --fail --location --silent --show-error --retry 3 --retry-delay 2 --retry-all-errors \
            "$url" --output "$download_dir/$archive"
          printf '%s  %s\n' "$expected_sha256" "$download_dir/$archive" |
            sha256sum --check --status -
          tar -xJf "$download_dir/$archive" -C "$download_dir"
          mkdir -p -- "$install_dir"
          install -m 0755 "$download_dir/shellcheck-v${version}/shellcheck" "$install_dir/shellcheck"
          printf '%s\n' "$install_dir" >>"$GITHUB_PATH"

      - name: Report the interpreter
        # The tree targets bash 5.2 and one gate checks for constructs that need
        # it. A runner that quietly moved to another major version should say so
        # here rather than through a parse error halfway down the suite.
        #
        run: |
          set -euo pipefail
          bash --version | head -1
          jq --version
          shellcheck --version
          shellcheck --version | grep -Fx 'version: 0.11.0'
          git --version

      - name: Identify git
        # Several suites create throwaway repositories and commit in them. A
        # runner has no global identity, and `git commit` fails without one --
        # as a suite failure that says nothing about the actual cause.
        run: |
          git config --global user.email ci@example.invalid
          git config --global user.name  'agent-kit CI'
          git config --global init.defaultBranch main

      - name: Verify plugin manifest versions
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          tests/build-plugin.sh
          if [[ -n ${RELEASE_TAG:-} ]]; then
            tests/check-release-version.sh --tag "$RELEASE_TAG"
          else
            tests/check-release-version.sh
          fi

      - name: Run the suite
        run: tests/run-tests.sh

  record-tier0:
    name: record tier0 on merge
    # Slice 6 of epic #152 ("Cadence", issue #328): free-to-compute Tier 0 is
    # recorded on every merge to main instead of only being run by hand.
    # Restricted to push events on main (never pull_request, never a tag or
    # release) so it only ever measures already-merged history, and guarded
    # against the commit message this job's own push produces so the
    # resulting push does not re-trigger itself into an unbounded loop of
    # self-measuring commits.
    needs: tests
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      !startsWith(github.event.head_commit.message, 'chore(bench): record tier0')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      # The only job in this workflow that pushes back to the repository;
      # every other job keeps the workflow-level contents: read default.
      contents: write
    concurrency:
      # A dedicated, non-cancelling group: the workflow-level group above
      # cancels an in-progress run when a newer push lands on the same ref,
      # which would let a merge's Tier-0 recording get dropped mid-push.
      # Serializing (rather than canceling) here is what keeps "exactly one
      # record per merge" true even when merges land in quick succession.
      group: record-tier0-main
      cancel-in-progress: false
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          # Always the current tip of main, not the triggering SHA: on a
          # manual re-run after a previous run already pushed the record,
          # this is what lets the idempotency check in ci-record-tier0.sh
          # see that commit and no-op instead of appending a duplicate.
          ref: main
          fetch-depth: 0

      - name: Identify git
        run: |
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config --global user.name  'github-actions[bot]'

      - name: Record Tier 0 for this merge
        env:
          MERGE_SHA: ${{ github.sha }}
        run: tests/ci-record-tier0.sh --sha "$MERGE_SHA" --push
