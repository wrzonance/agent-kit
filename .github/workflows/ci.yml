name: CI

# The suite is the only thing standing between this tree and the classes of
# defect an external review already found in it. Running it locally is a habit;
# running it here is a fact.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: gates and suites
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Install pinned ShellCheck
        # Reference release: ShellCheck v0.11.0
        # SHA-256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          set -euo pipefail
          version=0.11.0
          archive='shellcheck-v0.11.0.linux.x86_64.tar.xz'
          url="https://github.com/koalaman/shellcheck/releases/download/v${version}/${archive}"
          expected_sha256=8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
          download_dir=$(mktemp -d)
          install_dir="${RUNNER_TEMP}/shellcheck-v${version}/bin"
          trap 'rm -rf -- "$download_dir"' EXIT
          curl --fail --location --silent --show-error "$url" --output "$download_dir/$archive"
          printf '%s  %s\n' "$expected_sha256" "$download_dir/$archive" |
            sha256sum --check --status -
          tar -xJf "$download_dir/$archive" -C "$download_dir"
          mkdir -p -- "$install_dir"
          install -m 0755 "$download_dir/shellcheck-v${version}/shellcheck" "$install_dir/shellcheck"
          printf '%s\n' "$install_dir" >>"$GITHUB_PATH"

      - name: Report the interpreter
        # The tree targets bash 5.2 and one gate checks for constructs that need
        # it. A runner that quietly moved to another major version should say so
        # here rather than through a parse error halfway down the suite.
        #
        run: |
          set -euo pipefail
          bash --version | head -1
          jq --version
          shellcheck --version
          shellcheck --version | grep -Fx 'version: 0.11.0'
          git --version

      - name: Identify git
        # Several suites create throwaway repositories and commit in them. A
        # runner has no global identity, and `git commit` fails without one --
        # as a suite failure that says nothing about the actual cause.
        run: |
          git config --global user.email ci@example.invalid
          git config --global user.name  'agent-kit CI'
          git config --global init.defaultBranch main

      - name: Run the suite
        run: tests/run-tests.sh
