name: Record Tier 0

# Slice 6 of epic #152 ("Cadence", issue #328): free-to-compute Tier 0 is
# recorded on every merge to main instead of only being run by hand.
#
# This is a SEPARATE workflow file from ci.yml, deliberately. ci.yml's own
# concurrency group (`ci-${{ github.ref }}`, cancel-in-progress: true)
# cancels the ENTIRE workflow run -- every job in it -- the instant a newer
# push lands on the same ref; a job-level concurrency setting on a job
# living inside that workflow cannot exempt it from that run-level
# cancellation (a job-level group only arbitrates between instances of that
# job, it does not opt the job out of its own run being torn down). Living
# in its own workflow file means this job's scheduling is never subject to
# ci.yml's group at all, so a fast run of merges cannot silently drop an
# earlier merge's Tier-0 record the way embedding it as a job in ci.yml did.
#
# Triggered by `workflow_run` on CI's completion (never `push` directly) so
# a merge is only recorded once its own CI run has actually finished
# green -- a broken merge's tests failing (or that merge's own CI run being
# canceled by ci.yml's group when a later push lands first) means it is
# never independently recorded, consistent with ci.yml already treating
# that commit as not independently verified.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# Deliberately NO concurrency group here. A GitHub Actions concurrency
# group only ever retains at most one PENDING run per group: when a new run
# is queued while another is in progress, any previously-pending run in
# that same group is cancelled outright -- cancel-in-progress: false only
# protects the run that is currently executing, it does not turn the group
# into a queue. So three CI completions in quick succession (A running, B
# pending, C arrives) would cancel B and silently drop its merge's Tier-0
# record -- exactly the "exactly one record per merge" violation this
# workflow exists to prevent. Removing the group means every successful
# CI completion gets its own run, and the wrapper's own concurrency safety
# (tests/ci-record-tier0.sh --push fetches and hard-resets to the remote
# tip immediately before its idempotency check on every attempt, and
# restarts the whole cycle on a rejected push) is what actually keeps
# concurrent runs from double-recording or losing a record.
jobs:
  record-tier0:
    name: record tier0 on merge
    # No commit-message guard here. A commit message is ordinary
    # user-writable text -- a merge/squash commit that happens to start
    # with the same prefix this job's own push produces would silently
    # suppress recording for that merge, with no warning. The actual
    # anti-recursion mechanism lives in the push itself: the wrapper's
    # commit message carries `[skip ci]` (see tests/ci-record-tier0.sh),
    # which stops ci.yml's `on: push` trigger from creating a CI run for
    # that push at all. No CI run means no `workflow_run` completion event,
    # so this workflow can never be re-triggered by its own commit -- the
    # loop is broken structurally, not by pattern-matching text an
    # attacker (or an unlucky PR title) could reproduce.
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      # The only permission this workflow needs beyond the read-only
      # default: pushing the appended ledger record back to main.
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: main
          fetch-depth: 0

      - name: Identify git
        run: |
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config --global user.name  'github-actions[bot]'

      - name: Record Tier 0 for this merge
        env:
          MERGE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: tests/ci-record-tier0.sh --sha "$MERGE_SHA" --push
